[supervisord]
nodaemon=false
logfile=%(here)s/logs/supervisord.log
pidfile=%(here)s/logs/supervisord.pid
childlogdir=%(here)s/logs

[unix_http_server]
file=%(here)s/logs/supervisor.sock

[supervisorctl]
serverurl=unix://%(here)s/logs/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:api]
command=%(here)s/.venv/bin/python -m app
directory=%(here)s
autostart=true
autorestart=true
startretries=3
stdout_logfile=%(here)s/logs/api.log
stderr_logfile=%(here)s/logs/api.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
